name: Test uppercase input string
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          string: "ALL CAPS INPUT"
      - name: Assert lowercase output
        env:
          ACTUAL: ${{ steps.action.outputs.lowercase }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "all caps input" ]; then
            echo "FAIL: expected 'all caps input', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert uppercase output
        env:
          ACTUAL: ${{ steps.action.outputs.uppercase }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "ALL CAPS INPUT" ]; then
            echo "FAIL: expected 'ALL CAPS INPUT', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert capitalized output
        env:
          ACTUAL: ${{ steps.action.outputs.capitalized }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "All caps input" ]; then
            echo "FAIL: expected 'All caps input', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
