name: Test lowercase input string
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          string: "already lowercase"
      - name: Assert lowercase output
        env:
          ACTUAL: ${{ steps.action.outputs.lowercase }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "already lowercase" ]; then
            echo "FAIL: expected 'already lowercase', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert uppercase output
        env:
          ACTUAL: ${{ steps.action.outputs.uppercase }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "ALREADY LOWERCASE" ]; then
            echo "FAIL: expected 'ALREADY LOWERCASE', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert capitalized output
        env:
          ACTUAL: ${{ steps.action.outputs.capitalized }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Already lowercase" ]; then
            echo "FAIL: expected 'Already lowercase', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
