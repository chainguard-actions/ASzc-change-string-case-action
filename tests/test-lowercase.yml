name: Test lowercase output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          string: "Hello World"
      - name: Assert lowercase output
        env:
          ACTUAL: ${{ steps.action.outputs.lowercase }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello world" ]; then
            echo "FAIL: expected 'hello world', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
